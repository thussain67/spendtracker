<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E7EDEB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E7EDEB;
    --bg-raised:#FFFFFF;
    --bg-sunken:#DDE8E3;
    --ink:#23281F;
    --ink-soft:#7A857D;
    --line:#DCE5E1;
    --green:#69A481;
    --rust:#7C1F31;
    --gold:#A8791E;
    --amber:#C9962A;
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    padding: max(14px, env(safe-area-inset-top)) 14px max(20px, env(safe-area-inset-bottom));
    position:relative;
  }
  button{-webkit-touch-callout:none; -webkit-user-select:none; user-select:none;}
  .num{font-family:'Inter', sans-serif;}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
  }
  .month-nav{display:flex; align-items:center; gap:4px;}
  .month-nav button{
    background:none; border:none; cursor:pointer; color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    min-width:40px; min-height:40px;
  }
  .month-label{
    font-family:'Inter', sans-serif; font-weight:700; font-size:23px;
    letter-spacing:0.005em;
  }
  .icon-btn{
    background:none; border:none; cursor:pointer; color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    min-width:40px; min-height:40px;
  }
  .icon-btn:active{opacity:0.55;}
  .topbar-actions{display:flex; gap:0px;}

  /* ---------- signature stripe ---------- */
  /* stripe removed — didn't fit the calmer light theme */
  .stripe span{flex:1; border-radius:2px;}

  /* ---------- summary card ---------- */
  .summary{
    background:var(--bg-raised);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    border-radius:18px;
    padding:18px 18px 16px;
    margin-bottom:16px;
    cursor:pointer;
  }
  .summary:active{opacity:0.85;}
  .summary-chevron{color:var(--ink-soft); flex-shrink:0;}
  .summary-top{display:flex; align-items:center; gap:14px; margin-bottom:12px;}
  .summary-label{font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px;}
  .summary-remaining{font-size:31px; font-weight:700; line-height:1; color:var(--green);}
  .summary-remaining.over{color:var(--rust);}
  .summary-remaining.muted{color:var(--ink-soft);}
  .summary-sub{font-size:13px; color:var(--ink-soft); margin-top:6px;}
  .bar{
    height:8px; background:var(--bg-sunken); border-radius:4px; overflow:hidden; margin-top:12px;
  }
  .bar-fill{height:100%; background:var(--green); border-radius:4px;}
  .bar-fill.over{background:var(--rust);}

  /* ---------- pace card ---------- */
  .pace-card{
    background:var(--bg-raised);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    border-radius:18px;
    border-left:3px solid var(--ink-soft);
    padding:16px 18px 14px;
    margin-bottom:18px;
  }
  .pace-label{font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px;}
  .pace-headline{font-size:19px; font-weight:600; line-height:1.25;}
  .pace-headline.muted{color:var(--ink-soft); font-size:15px; font-weight:500;}
  .pace-sub{font-size:13px; color:var(--ink-soft); margin-top:6px;}
  .pace-projection{font-size:12.5px; margin-top:8px;}

  /* ---------- sub-category breakdown ---------- */
  .breakdown-row{padding:11px 0; border-bottom:1px solid var(--line);}
  .breakdown-row:last-child{border-bottom:none;}
  .breakdown-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
  .breakdown-sub{font-size:14px; font-weight:500; color:var(--ink);}
  .breakdown-cat{font-size:12px; color:var(--ink-soft); margin-top:1px;}
  .breakdown-amt{font-family:'Inter', sans-serif; font-size:14px; white-space:nowrap; text-align:right;}
  .breakdown-pct{color:var(--ink-soft); font-size:12px;}
  .breakdown-bar{height:4px; background:var(--bg-sunken); margin-top:7px; overflow:hidden; border-radius:2px;}
  .breakdown-bar-fill{height:100%;}

  /* ---------- surplus card ---------- */
  .surplus{
    background:var(--bg-raised);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    border-radius:18px;
    padding:16px 18px 14px;
    margin-top:14px;
  }
  .surplus-label{font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px;}
  .surplus-amount{font-size:32px; font-weight:700; line-height:1; color:var(--ink);}
  .surplus-amount.negative{color:var(--rust);}
  .surplus-sub{font-size:13px; color:var(--ink-soft); margin-top:6px;}

  /* ---------- section label ---------- */
  .section-label{
    font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--ink-soft); margin: 18px 2px 8px;
  }

  /* ---------- category cards ---------- */
  .cat-list{display:flex; flex-direction:column; gap:8px;}
  .cat-card{
    background:var(--bg-raised);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    border-radius:16px;
    padding:10px 14px;
    display:flex; align-items:center; gap:12px;
    cursor:pointer;
    text-align:left;
    transition:opacity 0.15s;
  }
  .cat-card:active{opacity:0.7;}
  .cat-card.greyed{opacity:0.55;}
  .cat-ring{flex-shrink:0; width:40px; height:40px;}
  .ring-wrap{position:relative; flex-shrink:0;}
  .ring-wrap svg{position:absolute; top:0; left:0;}
  .ring-pct{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Inter', sans-serif; font-weight:700; color:var(--ink);
  }
  .cat-main{flex:1; min-width:0; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .cat-text{min-width:0;}
  .cat-label{
    font-size:14.5px; color:var(--ink); font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .cat-sub{font-size:11.5px; color:var(--ink-soft); margin-top:1px;}
  .cat-remaining{font-size:18px; font-weight:700; line-height:1.2; color:var(--green); white-space:nowrap; text-align:right;}
  .cat-remaining.over{color:var(--rust);}
  .cat-remaining.muted{color:var(--ink-soft); font-size:14px; font-weight:600;}
  .empty-hint{color:var(--ink-soft); font-size:13px; padding:14px 4px;}

  /* ---------- recent activity ---------- */
  .receipt-block{background:var(--bg-raised); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:16px; padding:4px 14px 8px;}
  .receipt-line{
    display:flex; justify-content:space-between; gap:10px;
    padding:9px 0; border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .receipt-line:last-child{border-bottom:none;}
  .receipt-left{min-width:0;}
  .receipt-date{color:var(--ink-soft); font-size:11px;}
  .receipt-cat{font-weight:500; color:var(--ink);}
  .receipt-note{color:var(--ink-soft);}
  .receipt-amt{font-family:'Inter', sans-serif; white-space:nowrap; color:var(--ink);}
  .see-all{
    display:block; text-align:center; padding:10px 0 2px; font-size:12px;
    color:var(--gold); cursor:pointer; text-decoration:underline;
  }

  @keyframes slideIn{
    from{opacity:0; transform:translateY(-6px);}
    to{opacity:1; transform:translateY(0);}
  }
  .entry-in{animation:slideIn 0.25s ease-out;}
  @media (prefers-reduced-motion: reduce){ .entry-in{animation:none;} }

  /* ---------- sheet / modal ---------- */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.55);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .sheet{
    width:100%; max-width:480px; background:var(--bg-raised);
    border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;
    padding: 18px 18px max(20px, env(safe-area-inset-bottom));
    animation: sheetUp 0.2s ease-out;
    max-height:85vh; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain;
  }
  .chip-row{display:flex; flex-wrap:wrap; gap:7px; margin-top:8px;}
  .chip{
    padding:7px 12px; border:1px solid var(--line); background:var(--bg);
    font-size:13px; cursor:pointer; border-radius:14px; color:var(--ink);
    font-family:'Inter', sans-serif;
  }
  .chip.selected{background:var(--gold); color:#FFFFFF; border-color:var(--gold); font-weight:600;}
  .refund-toggle{
    display:block; width:100%; text-align:left; margin-top:10px; padding:10px 12px;
    border:1px solid var(--line); border-radius:10px; background:var(--bg);
    font-family:'Inter', sans-serif; font-size:13px; color:var(--ink-soft); cursor:pointer;
  }
  .refund-toggle.active{background:var(--bg-sunken); border-color:var(--ink-soft); color:var(--ink); font-weight:600;}
  .chip:active{opacity:0.75;}
  @keyframes sheetUp{ from{transform:translateY(100%);} to{transform:translateY(0);} }
  .sheet-title{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .sheet-color{width:11px; height:11px; border-radius:50%; background:var(--cat-color, var(--gold));}
  .sheet-title h2{font-family:'Inter', sans-serif; font-weight:600; font-size:19px; margin:0;}
  label{display:block; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; margin-top:16px;}
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=number], input[type=date]{
    width:100%; font-size:17px; padding:10px 0; border:none; border-bottom:1px solid var(--line);
    background:transparent; font-family:'Inter', sans-serif; color:var(--ink);
  }
  input::placeholder{color:var(--ink-soft); opacity:0.7;}
  input[type=date]{color-scheme:light;}
  input.num-input{font-family:'Inter', sans-serif; font-size:26px; font-weight:500;}
  input:focus{outline:none; border-bottom:1.5px solid var(--gold);}
  .amt-row{display:flex; align-items:baseline; gap:6px; border-bottom:1px solid var(--line);}
  .amt-row .symbol{font-family:'Inter', sans-serif; font-size:26px; color:var(--ink-soft);}
  .amt-row input{border-bottom:none;}
  .sheet-actions{display:flex; gap:10px; margin-top:22px;}
  button.btn{
    flex:1; padding:13px; border:none; font-size:14px; font-weight:500; cursor:pointer;
    font-family:'Inter', sans-serif; letter-spacing:0.02em;
    border-radius:12px;
  }
  .btn-primary{background:var(--ink); color:#FFFFFF; font-weight:600;}
  .btn-primary:active{opacity:0.8;}
  .btn-secondary{background:none; border:1px solid var(--line); color:var(--ink);}
  .btn-secondary:active{background:var(--bg);}
  .btn-danger{background:var(--rust); color:#fff;}

  /* ---------- back header for sub-views ---------- */
  .subview-header{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
  .subview-header h1{font-family:'Inter', sans-serif; font-size:20px; font-weight:600; margin:0;}

  /* ---------- settings ---------- */
  .setting-row{
    display:flex; align-items:center; gap:10px;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .setting-row .swatch{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .setting-row input[type=number]{width:70px; font-size:16px; border-bottom:1px solid var(--line); text-align:right; padding:6px 0;}
  .setting-row .del{color:var(--ink-soft); background:none; border:none; cursor:pointer; padding:4px;}
  .name-toggle{
    flex:1; display:flex; justify-content:space-between; align-items:center; gap:8px;
    background:none; border:none; cursor:pointer; padding:0; text-align:left;
    color:var(--ink); font-family:'Inter', sans-serif; min-width:0; font-size:14px; font-weight:500;
  }
  .chevron{color:var(--ink-soft); font-size:11px; flex-shrink:0;}
  .sub-block{padding:2px 0 12px 19px;}
  .sub-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0; font-size:13px; color:var(--ink-soft); border-bottom:1px solid var(--line);
  }
  .sub-row .del{background:none; border:none; color:var(--ink-soft); cursor:pointer; padding:2px;}
  .add-sub-form{display:flex; gap:6px; margin-top:10px;}
  .add-sub-form input{flex:1; font-size:16px; padding:6px 0; border:none; border-bottom:1px solid var(--line); background:transparent; font-family:'Inter', sans-serif; color:var(--ink);}
  .add-sub-form input:focus{outline:none; border-bottom:1.5px solid var(--gold);}
  .add-sub-form button{font-size:12px; padding:6px 12px; background:none; border:1px solid var(--line); border-radius:8px; cursor:pointer; color:var(--ink);}
  .confirm-row{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); gap:10px;}
  .confirm-row span{font-size:13px; color:var(--rust);}
  .confirm-row .actions{display:flex; gap:8px;}
  .confirm-row button{font-size:12px; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:none; cursor:pointer; color:var(--ink);}
  .add-cat-form{display:flex; gap:8px; margin-top:16px; align-items:flex-end;}
  .add-cat-form input[type=text]{flex:1;}
  .add-cat-form input[type=number]{width:80px;}
  .add-cat-form button{padding:10px 14px; background:var(--gold); color:#FFFFFF; border:none; border-radius:10px; cursor:pointer; font-size:13px; font-weight:600;}
  .danger-zone{margin-top:36px; padding-top:16px; border-top:1px solid var(--line);}
  .link-danger{color:var(--rust); font-size:12px; text-decoration:underline; cursor:pointer; background:none; border:none; padding:0;}
  .currency-row{display:flex; gap:10px; align-items:center; margin-top:6px;}
  .currency-row input{width:60px;}

  .loading-state{text-align:center; padding:80px 20px; color:var(--ink-soft); font-size:14px;}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--bg-sunken); padding:10px 16px; font-size:13px; font-weight:500;
    border-radius:10px;
    z-index:60; opacity:0; transition:opacity 0.2s;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app"><div class="loading-state">Opening your ledger…</div></div>
<div id="toast" class="toast"></div>

<script>
const PALETTE = ['#4A4FA0','#1E7A72','#A13D80','#1E5A8A','#6B3FA0','#2C6E8A','#5C6B73'];
const DEFAULT_CATEGORIES = [
  {id:'cat-shopping', name:'Shopping', budget:0},
  {id:'cat-gifts', name:'Gifts', budget:0},
  {id:'cat-holiday-travel', name:'Holiday travel', budget:0},
  {id:'cat-food', name:'Food spend', budget:0},
  {id:'cat-travel', name:'Travel', budget:0},
  {id:'cat-entertainment', name:'Entertainment', budget:0},
  {id:'cat-other', name:'Misc/Buffer', budget:0},
];
const DEFAULT_SUBCATEGORIES = [
  {id:'sub-1', name:'Clothing & accessories', categoryId:'cat-shopping'},
  {id:'sub-2', name:'Homeware', categoryId:'cat-shopping'},
  {id:'sub-2b', name:'Electronics & tech', categoryId:'cat-shopping'},
  {id:'sub-2c', name:'Beauty & personal care', categoryId:'cat-shopping'},
  {id:'sub-2d', name:'Hobbies & leisure', categoryId:'cat-shopping'},
  {id:'sub-3', name:'Gifts', categoryId:'cat-gifts'},
  {id:'sub-4', name:'Holiday travel', categoryId:'cat-holiday-travel'},
  {id:'sub-6', name:'Restaurant', categoryId:'cat-food'},
  {id:'sub-7', name:'Groceries', categoryId:'cat-food'},
  {id:'sub-8', name:'Home delivery', categoryId:'cat-food'},
  {id:'sub-9', name:'Café/coffee', categoryId:'cat-food'},
  {id:'sub-10', name:'Snacks', categoryId:'cat-food'},
  {id:'sub-11', name:'Parking', categoryId:'cat-travel'},
  {id:'sub-12', name:'Taxi', categoryId:'cat-travel'},
  {id:'sub-13', name:'Fuel/Charging', categoryId:'cat-travel'},
  {id:'sub-14', name:'Insurance', categoryId:'cat-travel'},
  {id:'sub-15', name:'TfL', categoryId:'cat-travel'},
  {id:'sub-18', name:'Theatre', categoryId:'cat-entertainment'},
  {id:'sub-19', name:'Cinema', categoryId:'cat-entertainment'},
  {id:'sub-20', name:'Concerts', categoryId:'cat-entertainment'},
  {id:'sub-21', name:'Gallery', categoryId:'cat-entertainment'},
  {id:'sub-22', name:'Gaming', categoryId:'cat-entertainment'},
  {id:'sub-23', name:'Events', categoryId:'cat-entertainment'},
  {id:'sub-25c', name:'One-off purchase', categoryId:'cat-other'},
  {id:'sub-25d', name:'Uncategorised', categoryId:'cat-other'},
];

let state = {
  ready:false,
  categories: [],
  subcategories: [],
  budgets: [],
  entries: [],
  currency: '£',
  monthlyFunds: [],
  pinnedMonth: null,
  view: 'home',           // home | history | settings
  viewMonth: null,        // {y, m}
  activeCategory: null,   // category object when logging
  pendingSubcategoryId: null,
  editingEntryId: null,
  pendingIsRefund: false,
  expandedCategoryId: null,
  confirmDeleteEntry: null,
  confirmDeleteCat: null,
  confirmDeleteSub: null,
  confirmClearAll: false,
};

function uid(){
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8);
}

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

const STORE_PREFIX = 'ledger:';

async function loadData(){
  try{
    const raw = localStorage.getItem(STORE_PREFIX+'categories');
    state.categories = raw ? JSON.parse(raw) : DEFAULT_CATEGORIES.slice();
  }catch(e){ state.categories = DEFAULT_CATEGORIES.slice(); }

  try{
    const raw = localStorage.getItem(STORE_PREFIX+'subcategories');
    state.subcategories = raw ? JSON.parse(raw) : DEFAULT_SUBCATEGORIES.slice();
  }catch(e){ state.subcategories = DEFAULT_SUBCATEGORIES.slice(); }

  try{
    const raw = localStorage.getItem(STORE_PREFIX+'entries');
    state.entries = raw ? JSON.parse(raw) : [];
  }catch(e){ state.entries = []; }
  state.entries.forEach(e=>{
    if(!e.budgetMonth){
      const [ey, em] = e.date.split('-').map(Number);
      e.budgetMonth = monthKeyOf(ey, em-1);
    }
  });

  try{
    const raw = localStorage.getItem(STORE_PREFIX+'budgets');
    state.budgets = raw ? JSON.parse(raw) : [];
  }catch(e){ state.budgets = []; }
  if(!state.budgets.length){
    // Migrate any legacy flat per-category budget onto the current month, one time.
    const now = new Date();
    const curKey = monthKeyOf(now.getFullYear(), now.getMonth());
    state.categories.forEach(c=>{
      if(c.budget > 0){
        state.budgets.push({categoryId:c.id, monthKey:curKey, amount:c.budget});
      }
    });
  }

  try{
    const raw = localStorage.getItem(STORE_PREFIX+'currency');
    state.currency = raw || '£';
  }catch(e){ state.currency = '£'; }

  try{
    const raw = localStorage.getItem(STORE_PREFIX+'monthlyFunds');
    state.monthlyFunds = raw ? JSON.parse(raw) : [];
  }catch(e){ state.monthlyFunds = []; }
  if(!state.monthlyFunds.length){
    // Migrate any legacy flat "monthly available funds" value onto the current month, one time.
    try{
      const legacy = localStorage.getItem(STORE_PREFIX+'monthlyAvailableFunds');
      if(legacy && parseFloat(legacy) > 0){
        const now = new Date();
        state.monthlyFunds.push({monthKey: monthKeyOf(now.getFullYear(), now.getMonth()), amount: parseFloat(legacy)});
      }
    }catch(e){}
  }

  try{
    const raw = localStorage.getItem(STORE_PREFIX+'pinnedMonth');
    state.pinnedMonth = raw ? JSON.parse(raw) : null;
  }catch(e){ state.pinnedMonth = null; }

  const now = new Date();
  state.viewMonth = state.pinnedMonth
    ? {y: state.pinnedMonth.y, m: state.pinnedMonth.m}
    : {y: now.getFullYear(), m: now.getMonth()};
  state.ready = true;
  render();
}

async function saveCategories(){
  try{ localStorage.setItem(STORE_PREFIX+'categories', JSON.stringify(state.categories)); }
  catch(e){ showToast('Could not save — your browser storage may be full'); }
}
async function saveSubcategories(){
  try{ localStorage.setItem(STORE_PREFIX+'subcategories', JSON.stringify(state.subcategories)); }
  catch(e){ showToast('Could not save — your browser storage may be full'); }
}
async function saveBudgets(){
  try{ localStorage.setItem(STORE_PREFIX+'budgets', JSON.stringify(state.budgets)); }
  catch(e){ showToast('Could not save — your browser storage may be full'); }
}
async function saveEntries(){
  try{ localStorage.setItem(STORE_PREFIX+'entries', JSON.stringify(state.entries)); }
  catch(e){ showToast('Could not save — your browser storage may be full'); }
}
async function saveCurrency(){
  try{ localStorage.setItem(STORE_PREFIX+'currency', state.currency); }
  catch(e){ showToast('Could not save — your browser storage may be full'); }
}
async function saveMonthlyFunds(){
  try{ localStorage.setItem(STORE_PREFIX+'monthlyFunds', JSON.stringify(state.monthlyFunds)); }
  catch(e){ showToast('Could not save — your browser storage may be full'); }
}
function getMonthlyFunds(y, m){
  const key = monthKeyOf(y, m);
  const f = state.monthlyFunds.find(f => f.monthKey === key);
  return f ? Number(f.amount) : 0;
}
function setMonthlyFunds(y, m, amount){
  const key = monthKeyOf(y, m);
  const existing = state.monthlyFunds.find(f => f.monthKey === key);
  if(existing){ existing.amount = amount; }
  else{ state.monthlyFunds.push({monthKey:key, amount}); }
}
async function savePinnedMonth(){
  try{
    if(state.pinnedMonth) localStorage.setItem(STORE_PREFIX+'pinnedMonth', JSON.stringify(state.pinnedMonth));
    else localStorage.removeItem(STORE_PREFIX+'pinnedMonth');
  }catch(e){ showToast('Could not save — your browser storage may be full'); }
}

function money(n){
  const v = Number(n)||0;
  const sign = v < 0 ? '-' : '';
  return sign + state.currency + Math.abs(v).toLocaleString('en-GB', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function catColor(index){ return PALETTE[index % PALETTE.length]; }

function monthKeyOf(y, m){
  return y + '-' + String(m+1).padStart(2,'0');
}

function entryDateMonthKey(e){
  const [ey, em] = e.date.split('-').map(Number);
  return monthKeyOf(ey, em-1);
}

function entriesForMonth(y, m){
  const key = monthKeyOf(y, m);
  return state.entries.filter(e => e.budgetMonth === key);
}

function spentForCategory(catId, y, m){
  return entriesForMonth(y,m).filter(e=>e.categoryId===catId).reduce((s,e)=>s+Number(e.amount),0);
}

function getBudget(categoryId, y, m){
  const key = monthKeyOf(y, m);
  const b = state.budgets.find(b => b.categoryId === categoryId && b.monthKey === key);
  return b ? Number(b.amount) : 0;
}

function setBudget(categoryId, y, m, amount){
  const key = monthKeyOf(y, m);
  const existing = state.budgets.find(b => b.categoryId === categoryId && b.monthKey === key);
  if(existing){ existing.amount = amount; }
  else{ state.budgets.push({categoryId, monthKey:key, amount}); }
}

function monthLabel(y,m){
  return new Date(y, m, 1).toLocaleString('en-GB', {month:'long', year:'numeric'}).toUpperCase();
}

function monthLabelShort(key){
  const [y,m] = key.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleString('en-GB', {month:'short', year:'numeric'});
}

function fmtDate(dstr){
  const d = new Date(dstr + 'T00:00:00');
  return d.toLocaleDateString('en-GB', {day:'numeric', month:'short'});
}

function ring(pct, color, greyed, size=46){
  const r = 15, c = 2*Math.PI*r;
  const clamped = Math.max(0, Math.min(100, pct));
  const dash = greyed ? 0 : (clamped/100*c);
  const stroke = greyed ? 'var(--ink-soft)' : color;
  const track = greyed ? 'var(--line)' : 'var(--bg-sunken)';
  return `<svg width="${size}" height="${size}" viewBox="0 0 36 36">
    <circle cx="18" cy="18" r="${r}" fill="none" stroke="${track}" stroke-width="4"/>
    <circle cx="18" cy="18" r="${r}" fill="none" stroke="${stroke}" stroke-width="4" stroke-linecap="round"
      stroke-dasharray="${dash.toFixed(2)} ${(c-dash).toFixed(2)}" transform="rotate(-90 18 18)"/>
  </svg>`;
}

function ringWithLabel(pct, color, greyed, size, label, labelSize){
  return `<div class="ring-wrap" style="width:${size}px; height:${size}px;">
    ${ring(pct, color, greyed, size)}
    <span class="ring-pct" style="font-size:${labelSize}px;">${label}</span>
  </div>`;
}

/* ---------------- render ---------------- */
function render(){
  const app = document.getElementById('app');
  if(!state.ready){ app.innerHTML = '<div class="loading-state">Opening your ledger…</div>'; return; }
  if(state.view === 'settings'){ app.innerHTML = renderSettings(); bindSettings(); return; }
  if(state.view === 'history'){ app.innerHTML = renderHistory(); bindHistory(); return; }
  if(state.view === 'monthDetail'){ app.innerHTML = renderMonthDetail(); bindMonthDetail(); return; }
  app.innerHTML = renderHome();
  bindHome();
  if(state.activeCategory){
    const editEntry = state.editingEntryId ? state.entries.find(e=>e.id===state.editingEntryId) : null;
    openSheet(state.activeCategory, editEntry);
  }
}

function renderHome(){
  const {y,m} = state.viewMonth;
  const monthEntries = entriesForMonth(y,m);
  const totalSpent = monthEntries.reduce((s,e)=>s+Number(e.amount),0);
  const totalBudget = state.categories.reduce((s,c)=>s+getBudget(c.id,y,m),0);
  const hasAnyBudget = totalBudget > 0;
  const pct = hasAnyBudget ? Math.min(100, (totalSpent/totalBudget)*100) : 0;
  const over = hasAnyBudget && totalSpent > totalBudget;
  const totalRemaining = totalBudget - totalSpent;
  const hasFunds = getMonthlyFunds(y,m) > 0;
  const surplus = getMonthlyFunds(y,m) - totalBudget;

  const sortedCategories = state.categories.slice().sort((a,b) => getBudget(b.id,y,m) - getBudget(a.id,y,m));
  const catCards = sortedCategories.map((c)=>{
    const i = state.categories.findIndex(x=>x.id===c.id); // stable color regardless of sort position
    const spent = spentForCategory(c.id,y,m);
    const budget = getBudget(c.id,y,m);
    const hasBudget = budget > 0;
    const hasSpend = spent > 0;
    const noBudgetAlert = !hasBudget && hasSpend;
    const catPct = hasBudget ? Math.min(100,(spent/budget)*100) : 0;
    const catOver = hasBudget && spent > budget;
    const isExactlyFull = hasBudget && Math.round(spent*100) === Math.round(budget*100);
    const isNearLimit = hasBudget && !catOver && !isExactlyFull && catPct >= 90;
    const remaining = budget - spent;
    const greyed = !hasBudget && !hasSpend;

    let statusColor;
    if(catOver || noBudgetAlert) statusColor = 'var(--rust)';
    else if(isExactlyFull) statusColor = 'var(--ink-soft)';
    else if(isNearLimit) statusColor = 'var(--amber)';
    else statusColor = 'var(--green)';

    const amountLine = hasBudget
      ? `<div class="cat-remaining" style="color:${statusColor}">${money(Math.abs(remaining))} ${catOver?'over':'left'}</div>`
      : noBudgetAlert
        ? `<div class="cat-remaining" style="color:var(--rust)">${money(spent)} logged</div>`
        : `<div class="cat-remaining muted">£0 logged</div>`;
    const subLine = hasBudget
      ? `<div class="cat-sub">${money(spent)} spent of ${money(budget)}</div>`
      : noBudgetAlert
        ? `<div class="cat-sub" style="color:var(--rust)">No budget set</div>`
        : `<div class="cat-sub">No budget set</div>`;

    const usedPct = hasBudget ? Math.round((spent/budget)*100) : null;
    const ringLabel = hasBudget ? usedPct+'%' : '';
    const ringLabelSize = (usedPct !== null && usedPct >= 100) ? 9.5 : 11;
    const ringColor = statusColor;

    return `
      <button class="cat-card ${greyed?'greyed':''}" data-cat="${c.id}">
        ${ringWithLabel((catOver||noBudgetAlert)?100:catPct, ringColor, greyed, 42, ringLabel, ringLabelSize)}
        <div class="cat-main">
          <div class="cat-text">
            <div class="cat-label">${escapeHtml(c.name)}</div>
            ${subLine}
          </div>
          ${amountLine}
        </div>
      </button>`;
  }).join('');

  const recent = monthEntries.slice().sort((a,b)=> (b.createdAt||0)-(a.createdAt||0)).slice(0,5);
  const recentHtml = recent.length ? recent.map(e=>receiptLine(e)).join('') :
    `<div class="empty-hint">Nothing logged yet this month. Tap a category above to add your first entry.</div>`;

  return `
    <div class="topbar">
      <div class="month-nav">
        <button class="icon-btn" id="prevMonth">${ICON.chevronLeft}</button>
        <span class="month-label">${monthLabel(y,m)}</span>
        <button class="icon-btn" id="nextMonth">${ICON.chevronRight}</button>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="openHistory">${ICON.list}</button>
        <button class="icon-btn" id="openSettings">${ICON.gear}</button>
      </div>
    </div>

    
    <div class="summary" id="summaryCard">
      <div class="summary-top">
        ${ringWithLabel(over?100:pct, over?'var(--rust)':'var(--green)', !hasAnyBudget, 58, hasAnyBudget?Math.round((totalSpent/totalBudget)*100)+'%':'–', 15)}
        <div style="flex:1; min-width:0;">
          <div class="summary-label">Remaining this month</div>
          <div class="summary-remaining num ${!hasAnyBudget?'muted':(over?'over':'')}">${hasAnyBudget ? money(Math.abs(totalRemaining)) : money(0)}</div>
          <div class="summary-sub">${hasAnyBudget ? (over ? money(totalSpent-totalBudget)+' over your '+money(totalBudget)+' budget' : money(totalSpent)+' spent of '+money(totalBudget)+' budget') : 'No budgets set yet — add some in Settings'}</div>
        </div>
        <div class="summary-chevron">${ICON.chevronRight}</div>
      </div>
      <div class="bar"><div class="bar-fill ${over?'over':''}" style="width:${pct}%"></div></div>
    </div>

    <div class="section-label">Categories — tap to log a spend</div>
    <div class="cat-list">${catCards || '<div class="empty-hint">No categories yet. Add some in settings.</div>'}</div>

    <div class="surplus">
      <div class="surplus-label">Remaining surplus</div>
      <div class="surplus-amount num ${surplus<0?'negative':''}">${hasFunds ? money(Math.abs(surplus)) : money(0)}</div>
      <div class="surplus-sub">${hasFunds
        ? (surplus<0
            ? `You've allocated ${money(totalBudget-getMonthlyFunds(y,m))} more than your ${money(getMonthlyFunds(y,m))} available funds`
            : '')
        : 'Set your monthly available funds in Settings to track unallocated surplus'}</div>
    </div>

    <div class="section-label">Recent activity</div>
    <div class="receipt-block">
      ${recentHtml}
      ${monthEntries.length>5 ? `<span class="see-all" id="seeAll">See all ${monthEntries.length} entries →</span>` : ''}
    </div>
  `;
}

function receiptLine(e){
  const catLabel = e.subcategoryName ? escapeHtml(e.categoryName)+' · '+escapeHtml(e.subcategoryName) : escapeHtml(e.categoryName);
  return `
    <div class="receipt-line entry-in">
      <div class="receipt-left">
        <div class="receipt-cat">${catLabel}</div>
        <div class="receipt-date">${fmtDate(e.date)}${e.note ? ' · <span class="receipt-note">'+escapeHtml(e.note)+'</span>' : ''}</div>
      </div>
      <div class="receipt-amt">${money(e.amount)}</div>
    </div>`;
}

function bindHome(){
  document.getElementById('prevMonth').onclick = ()=>{ shiftMonth(-1); };
  document.getElementById('nextMonth').onclick = ()=>{ shiftMonth(1); };
  document.getElementById('openHistory').onclick = ()=>{ state.view='history'; render(); };
  document.getElementById('openSettings').onclick = ()=>{ state.view='settings'; render(); };
  document.getElementById('summaryCard').onclick = ()=>{ state.view='monthDetail'; render(); };
  const seeAll = document.getElementById('seeAll');
  if(seeAll) seeAll.onclick = ()=>{ state.view='history'; render(); };
  document.querySelectorAll('.cat-card').forEach(btn=>{
    btn.onclick = ()=>{
      const cat = state.categories.find(c=>c.id===btn.dataset.cat);
      openSheet(cat);
    };
  });
}

function shiftMonth(delta){
  let {y,m} = state.viewMonth;
  m += delta;
  if(m<0){ m=11; y--; } else if(m>11){ m=0; y++; }
  state.viewMonth = {y,m};
  render();
}

/* ---------------- log sheet ---------------- */
function openSheet(category, editEntry){
  state.activeCategory = category;
  state.editingEntryId = editEntry ? editEntry.id : null;
  state.pendingSubcategoryId = editEntry ? (editEntry.subcategoryId || null) : null;
  state.pendingIsRefund = editEntry ? editEntry.amount < 0 : false;
  if(editEntry){
    const [ey, em] = editEntry.budgetMonth.split('-').map(Number);
    state.pendingBudgetMonth = {y: ey, m: em-1};
  } else {
    state.pendingBudgetMonth = {y: state.viewMonth.y, m: state.viewMonth.m};
  }
  const idx = state.categories.findIndex(c=>c.id===category.id);
  const dotColor = idx>=0 ? catColor(idx) : 'var(--ink-soft)';
  const subs = state.subcategories.filter(s=>s.categoryId===category.id);
  const backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  backdrop.id = 'sheetBackdrop';
  backdrop.innerHTML = `
    <div class="sheet">
      <div class="sheet-title">
        <span class="sheet-color" style="background:${dotColor}"></span>
        <h2>${editEntry ? 'Edit entry' : escapeHtml(category.name)}</h2>
      </div>
      ${editEntry ? `<div class="cat-sub" style="margin:-10px 0 4px;">${escapeHtml(category.name)}</div>` : ''}
      <label>Amount</label>
      <div class="amt-row">
        <span class="symbol">${state.currency}</span>
        <input type="number" inputmode="decimal" step="0.01" min="0" class="num-input" id="amtInput" placeholder="0.00" value="${editEntry ? Math.abs(editEntry.amount) : ''}" autofocus>
      </div>
      <button type="button" id="refundToggle" class="refund-toggle ${state.pendingIsRefund?'active':''}">↩ This is a refund / return</button>
      ${subs.length ? `
        <label>Sub-category (optional)</label>
        <div class="chip-row" id="chipRow">
          ${subs.map(s=>`<button type="button" class="chip ${s.id===state.pendingSubcategoryId?'selected':''}" data-sub="${s.id}">${escapeHtml(s.name)}</button>`).join('')}
        </div>
      ` : ''}
      <label>Note (optional)</label>
      <input type="text" id="noteInput" placeholder="e.g. dinner with friends" autocapitalize="sentences" autocomplete="off" value="${editEntry ? escapeHtml(editEntry.note||'') : ''}">
      <label>Date</label>
      <input type="date" id="dateInput" value="${editEntry ? editEntry.date : todayStr()}">
      <label>Counts toward budget</label>
      <div class="month-nav" style="margin-top:2px;">
        <button type="button" class="icon-btn" id="bmPrev">${ICON.chevronLeft}</button>
        <span class="month-label" id="bmLabel" style="font-size:15px; flex:1; text-align:center;">${monthLabel(state.pendingBudgetMonth.y, state.pendingBudgetMonth.m)}</span>
        <button type="button" class="icon-btn" id="bmNext">${ICON.chevronRight}</button>
      </div>
      <div class="sheet-actions">
        <button class="btn btn-secondary" id="cancelLog">Cancel</button>
        <button class="btn btn-primary" id="saveLog">${editEntry ? 'Save changes' : 'Save entry'}</button>
      </div>
    </div>
  `;
  document.getElementById('app').appendChild(backdrop);
  document.getElementById('amtInput').focus();

  backdrop.onclick = (ev)=>{ if(ev.target===backdrop){ closeSheet(); } };
  document.getElementById('cancelLog').onclick = closeSheet;
  document.getElementById('saveLog').onclick = ()=> submitEntry(category);
  document.getElementById('refundToggle').onclick = (ev)=>{
    state.pendingIsRefund = !state.pendingIsRefund;
    ev.target.classList.toggle('active', state.pendingIsRefund);
  };
  document.querySelectorAll('[data-sub]').forEach(chip=>{
    chip.onclick = ()=>{
      const id = chip.dataset.sub;
      state.pendingSubcategoryId = (state.pendingSubcategoryId === id) ? null : id;
      document.querySelectorAll('[data-sub]').forEach(c=>{
        c.classList.toggle('selected', c.dataset.sub === state.pendingSubcategoryId);
      });
    };
  });
  document.getElementById('bmPrev').onclick = ()=> shiftPendingBudgetMonth(-1);
  document.getElementById('bmNext').onclick = ()=> shiftPendingBudgetMonth(1);
}

function shiftPendingBudgetMonth(delta){
  let {y,m} = state.pendingBudgetMonth;
  m += delta;
  if(m<0){ m=11; y--; } else if(m>11){ m=0; y++; }
  state.pendingBudgetMonth = {y,m};
  const label = document.getElementById('bmLabel');
  if(label) label.textContent = monthLabel(y,m);
}

function closeSheet(){
  const b = document.getElementById('sheetBackdrop');
  if(b) b.remove();
  state.activeCategory = null;
  state.editingEntryId = null;
  state.pendingSubcategoryId = null;
  state.pendingBudgetMonth = null;
  state.pendingIsRefund = false;
}

async function submitEntry(category){
  const rawAmt = parseFloat(document.getElementById('amtInput').value);
  if(!rawAmt || rawAmt<=0){ showToast('Enter an amount first'); return; }
  const amtVal = state.pendingIsRefund ? -Math.abs(rawAmt) : Math.abs(rawAmt);
  const note = document.getElementById('noteInput').value.trim();
  const date = document.getElementById('dateInput').value || todayStr();
  const sub = state.pendingSubcategoryId ? state.subcategories.find(s=>s.id===state.pendingSubcategoryId) : null;
  const bm = state.pendingBudgetMonth || state.viewMonth;

  if(state.editingEntryId){
    const entry = state.entries.find(e=>e.id===state.editingEntryId);
    if(entry){
      entry.subcategoryId = sub ? sub.id : null;
      entry.subcategoryName = sub ? sub.name : null;
      entry.amount = amtVal;
      entry.note = note;
      entry.date = date;
      entry.budgetMonth = monthKeyOf(bm.y, bm.m);
    }
    await saveEntries();
    closeSheet();
    showToast('Entry updated');
    render();
    return;
  }

  state.entries.push({
    id: uid(),
    categoryId: category.id,
    categoryName: category.name,
    subcategoryId: sub ? sub.id : null,
    subcategoryName: sub ? sub.name : null,
    amount: amtVal,
    note,
    date,
    budgetMonth: monthKeyOf(bm.y, bm.m),
    createdAt: Date.now(),
  });
  await saveEntries();
  closeSheet();
  showToast('Logged ' + money(amtVal) + ' to ' + category.name);
  render();
}

/* ---------------- history view ---------------- */
function renderHistory(){
  const {y,m} = state.viewMonth;
  const entries = entriesForMonth(y,m).slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const rows = entries.map(e=>{
    if(state.confirmDeleteEntry === e.id){
      return `<div class="confirm-row">
        <span>Delete this entry?</span>
        <div class="actions">
          <button data-yes="${e.id}">Yes</button>
          <button data-no="1">No</button>
        </div>
      </div>`;
    }
    const catLabel = e.subcategoryName ? escapeHtml(e.categoryName)+' · '+escapeHtml(e.subcategoryName) : escapeHtml(e.categoryName);
    return `
      <div class="receipt-line">
        <div class="receipt-left">
          <div class="receipt-cat">${catLabel}</div>
          <div class="receipt-date">${fmtDate(e.date)}${e.note ? ' · <span class="receipt-note">'+escapeHtml(e.note)+'</span>' : ''}</div>
        </div>
        <div style="display:flex; align-items:center; gap:6px;">
          <span class="receipt-amt">${money(e.amount)}</span>
          <button class="icon-btn" data-edit="${e.id}" style="color:var(--ink-soft)">${ICON.edit}</button>
          <button class="icon-btn" data-del="${e.id}" style="color:var(--ink-soft)">${ICON.trash}</button>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="subview-header">
      <button class="icon-btn" id="backHome">${ICON.chevronLeft}</button>
      <h1>History — ${monthLabel(y,m)}</h1>
    </div>
    <div class="month-nav" style="margin-bottom:16px;">
      <button class="icon-btn" id="prevMonth2">${ICON.chevronLeft}</button>
      <span class="month-label" style="font-size:14px">${monthLabel(y,m)}</span>
      <button class="icon-btn" id="nextMonth2">${ICON.chevronRight}</button>
    </div>
    ${entries.length ? `<div class="receipt-block" style="padding:4px 14px;">${rows}</div>` : '<div class="empty-hint">No entries for this month.</div>'}
  `;
}

function bindHistory(){
  document.getElementById('backHome').onclick = ()=>{ state.view='home'; render(); };
  document.getElementById('prevMonth2').onclick = ()=>{ shiftMonth(-1); render(); };
  document.getElementById('nextMonth2').onclick = ()=>{ shiftMonth(1); render(); };
  document.querySelectorAll('[data-del]').forEach(btn=>{
    btn.onclick = ()=>{ state.confirmDeleteEntry = btn.dataset.del; render(); };
  });
  document.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.onclick = ()=>{
      const entry = state.entries.find(e=>e.id===btn.dataset.edit);
      if(!entry) return;
      const category = state.categories.find(c=>c.id===entry.categoryId) || {id: entry.categoryId, name: entry.categoryName};
      openSheet(category, entry);
    };
  });
  document.querySelectorAll('[data-yes]').forEach(btn=>{
    btn.onclick = async ()=>{
      state.entries = state.entries.filter(e=>e.id!==btn.dataset.yes);
      state.confirmDeleteEntry = null;
      await saveEntries();
      render();
    };
  });
  document.querySelectorAll('[data-no]').forEach(btn=>{
    btn.onclick = ()=>{ state.confirmDeleteEntry = null; render(); };
  });
}

/* ---------------- month detail (pace + breakdown) ---------------- */
function computePace(y, m, totalSpent, totalBudget, hasAnyBudget){
  const today = new Date();
  const isCurrentMonth = today.getFullYear()===y && today.getMonth()===m;
  const isFutureMonth = (y > today.getFullYear()) || (y === today.getFullYear() && m > today.getMonth());
  const daysInMonth = new Date(y, m+1, 0).getDate();
  let daysElapsed;
  if(isFutureMonth) daysElapsed = 0;
  else if(isCurrentMonth) daysElapsed = today.getDate();
  else daysElapsed = daysInMonth;
  const elapsedPct = (daysElapsed/daysInMonth)*100;
  const spentPct = hasAnyBudget ? (totalSpent/totalBudget)*100 : null;
  const projectedTotal = daysElapsed>0 ? (totalSpent/daysElapsed)*daysInMonth : totalSpent;
  return {daysElapsed, daysInMonth, elapsedPct, spentPct, isFutureMonth, isCurrentMonth, projectedTotal};
}

function renderPaceCard(y, m, totalSpent, totalBudget, hasAnyBudget){
  if(!hasAnyBudget){
    return `<div class="pace-card">
      <div class="pace-label">Pace</div>
      <div class="pace-headline muted">Set a budget in Settings to track pace</div>
    </div>`;
  }
  const p = computePace(y, m, totalSpent, totalBudget, hasAnyBudget);
  if(p.isFutureMonth){
    return `<div class="pace-card">
      <div class="pace-label">Pace</div>
      <div class="pace-headline muted">This month hasn't started yet</div>
    </div>`;
  }
  const diff = p.spentPct - p.elapsedPct;
  let headline, color;
  if(!p.isCurrentMonth){
    headline = p.spentPct > 100 ? 'Finished over budget' : 'Finished under budget';
    color = p.spentPct > 100 ? 'var(--rust)' : 'var(--green)';
  } else if(diff > 5){
    headline = "Spending faster than the month is passing";
    color = 'var(--rust)';
  } else if(diff < -5){
    headline = "Comfortably ahead of pace";
    color = 'var(--green)';
  } else {
    headline = "Right on pace";
    color = 'var(--gold)';
  }
  const projectionLine = p.isCurrentMonth && p.daysElapsed>0
    ? `<div class="pace-projection" style="color:${p.projectedTotal>totalBudget?'var(--rust)':'var(--ink-soft)'}">
         At this rate, projected month-end spend is ${money(p.projectedTotal)}${p.projectedTotal>totalBudget ? ' — over your '+money(totalBudget)+' budget' : ''}
       </div>`
    : '';
  return `<div class="pace-card" style="border-left-color:${color}">
    <div class="pace-label">Pace</div>
    <div class="pace-headline" style="color:${color}">${headline}</div>
    <div class="pace-sub">${p.daysElapsed} of ${p.daysInMonth} days · ${Math.round(p.spentPct)}% of budget used</div>
    ${projectionLine}
  </div>`;
}

function subcategoryBreakdown(y, m){
  const entries = entriesForMonth(y, m);
  const map = new Map();
  entries.forEach(e=>{
    const subLabel = e.subcategoryName || 'No sub-category';
    const key = e.categoryId + '|' + subLabel;
    if(!map.has(key)) map.set(key, {categoryId:e.categoryId, categoryName:e.categoryName, subLabel, amount:0});
    map.get(key).amount += Number(e.amount);
  });
  return Array.from(map.values()).sort((a,b)=>b.amount-a.amount);
}

function renderMonthDetail(){
  const {y,m} = state.viewMonth;
  const monthEntries = entriesForMonth(y,m);
  const totalSpent = monthEntries.reduce((s,e)=>s+Number(e.amount),0);
  const totalBudget = state.categories.reduce((s,c)=>s+getBudget(c.id,y,m),0);
  const hasAnyBudget = totalBudget > 0;

  const breakdown = subcategoryBreakdown(y,m);
  const breakdownRows = breakdown.length ? breakdown.map(item=>{
    const idx = state.categories.findIndex(c=>c.id===item.categoryId);
    const color = idx>=0 ? catColor(idx) : 'var(--ink-soft)';
    const pctOfTotal = totalSpent>0 ? Math.round((item.amount/totalSpent)*100) : 0;
    return `
      <div class="breakdown-row">
        <div class="breakdown-top">
          <div>
            <div class="breakdown-sub">${escapeHtml(item.subLabel)}</div>
            <div class="breakdown-cat">${escapeHtml(item.categoryName)}</div>
          </div>
          <div class="breakdown-amt">${money(item.amount)} <span class="breakdown-pct">${pctOfTotal}%</span></div>
        </div>
        <div class="breakdown-bar"><div class="breakdown-bar-fill" style="width:${pctOfTotal}%; background:${color};"></div></div>
      </div>`;
  }).join('') : '<div class="empty-hint">No spend logged yet this month.</div>';

  return `
    <div class="subview-header">
      <button class="icon-btn" id="backHome3">${ICON.chevronLeft}</button>
      <h1>Month insight</h1>
    </div>
    <div class="month-nav" style="margin-bottom:16px;">
      <button class="icon-btn" id="prevMonth3">${ICON.chevronLeft}</button>
      <span class="month-label" style="font-size:15px">${monthLabel(y,m)}</span>
      <button class="icon-btn" id="nextMonth3">${ICON.chevronRight}</button>
    </div>

    ${renderPaceCard(y, m, totalSpent, totalBudget, hasAnyBudget)}

    <div class="section-label">Spend by sub-category</div>
    <div class="receipt-block">${breakdownRows}</div>
  `;
}

function bindMonthDetail(){
  document.getElementById('backHome3').onclick = ()=>{ state.view='home'; render(); };
  document.getElementById('prevMonth3').onclick = ()=>{ shiftMonth(-1); };
  document.getElementById('nextMonth3').onclick = ()=>{ shiftMonth(1); };
}

/* ---------------- settings view ---------------- */
function renderSubBlock(cat){
  const subs = state.subcategories.filter(s=>s.categoryId===cat.id);
  const rows = subs.map(s=>{
    if(state.confirmDeleteSub === s.id){
      return `<div class="confirm-row" style="padding-left:19px;">
        <span>Remove "${escapeHtml(s.name)}"?</span>
        <div class="actions">
          <button data-subyes="${s.id}">Yes</button>
          <button data-subno="1">No</button>
        </div>
      </div>`;
    }
    return `<div class="sub-row">
      <span class="sub-name">${escapeHtml(s.name)}</span>
      <button class="del" data-delsub="${s.id}">${ICON.trash}</button>
    </div>`;
  }).join('');
  return `
    <div class="sub-block">
      ${rows || '<div class="empty-hint" style="padding:4px 0 8px;">No sub-categories yet.</div>'}
      <div class="add-sub-form">
        <input type="text" data-newsub="${cat.id}" placeholder="New sub-category" autocapitalize="words" autocomplete="off">
        <button data-addsub="${cat.id}">Add</button>
      </div>
    </div>`;
}

function renderSettings(){
  const {y,m} = state.viewMonth;
  const rows = state.categories.map((c,i)=>{
    if(state.confirmDeleteCat === c.id){
      return `<div class="confirm-row">
        <span>Remove "${escapeHtml(c.name)}"? Past entries stay in history.</span>
        <div class="actions">
          <button data-catyes="${c.id}">Yes</button>
          <button data-catno="1">No</button>
        </div>
      </div>`;
    }
    const expanded = state.expandedCategoryId === c.id;
    const subCount = state.subcategories.filter(s=>s.categoryId===c.id).length;
    const budget = getBudget(c.id, y, m);
    return `
      <div class="setting-row">
        <span class="swatch" style="background:${catColor(i)}"></span>
        <button class="name-toggle" data-expand="${c.id}">
          <span>${escapeHtml(c.name)} <span style="color:var(--ink-soft); font-weight:400;">(${subCount})</span></span>
          <span class="chevron">${expanded ? '▾' : '▸'}</span>
        </button>
        <input type="number" inputmode="decimal" min="0" step="1" data-budget="${c.id}" value="${budget || ''}" placeholder="0">
        <button class="del" data-delcat="${c.id}">${ICON.trash}</button>
      </div>
      ${expanded ? renderSubBlock(c) : ''}`;
  }).join('');

  const clearRow = state.confirmClearAll ? `
    <div class="confirm-row">
      <span>Delete everything? This can't be undone.</span>
      <div class="actions">
        <button id="clearYes">Yes, clear all</button>
        <button id="clearNo">No</button>
      </div>
    </div>` : `<button class="link-danger" id="clearAll">Clear all data</button>`;

  return `
    <div class="subview-header">
      <button class="icon-btn" id="backHome2">${ICON.chevronLeft}</button>
      <h1>Settings</h1>
    </div>

    <div class="section-label">Monthly available funds — ${monthLabel(y,m)}</div>
    <div class="currency-row">
      <span style="font-family:'Inter', sans-serif; font-size:14px; color:var(--ink-soft)">${escapeHtml(state.currency)}</span>
      <input type="number" inputmode="decimal" id="fundsInput" min="0" step="1" value="${getMonthlyFunds(y,m) || ''}" placeholder="0" style="width:120px;">
      <span style="font-size:12px; color:var(--ink-soft)">used to track your surplus</span>
    </div>

    <div class="section-label">Currency symbol</div>
    <div class="currency-row">
      <input type="text" id="currencyInput" value="${escapeHtml(state.currency)}" maxlength="3">
      <span style="font-size:12px; color:var(--ink-soft)">e.g. £, $, €</span>
    </div>

    <div class="section-label">Categories &amp; budgets</div>
    <div class="month-nav" style="margin-bottom:6px;">
      <button class="icon-btn" id="setPrevMonth">${ICON.chevronLeft}</button>
      <span class="month-label" style="font-size:15px; flex:1; text-align:center;">Editing ${monthLabel(y,m)}</span>
      <button class="icon-btn" id="setNextMonth">${ICON.chevronRight}</button>
    </div>
    <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; font-size:12px; color:var(--ink-soft);">
      <span>${state.pinnedMonth ? `App opens on ${monthLabel(state.pinnedMonth.y, state.pinnedMonth.m)}` : `App opens on today's month`}</span>
      ${state.pinnedMonth && state.pinnedMonth.y===y && state.pinnedMonth.m===m
        ? `<button class="link-danger" id="clearPinnedMonth" style="color:var(--gold)">Use today's month instead</button>`
        : `<button class="link-danger" id="pinThisMonth" style="color:var(--gold)">Set this as default</button>`}
    </div>
    <div>${rows || '<div class="empty-hint">No categories yet.</div>'}</div>

    <div class="add-cat-form">
      <input type="text" id="newCatName" placeholder="New category name" autocapitalize="words" autocomplete="off">
      <input type="number" inputmode="decimal" id="newCatBudget" placeholder="Budget" min="0" step="1">
      <button id="addCat">Add</button>
    </div>

    <div class="danger-zone">${clearRow}</div>
  `;
}

function bindSettings(){
  document.getElementById('backHome2').onclick = ()=>{ state.view='home'; render(); };

  document.getElementById('currencyInput').onchange = async (ev)=>{
    state.currency = ev.target.value.trim() || '£';
    await saveCurrency();
    render();
  };

  document.getElementById('fundsInput').onchange = async (ev)=>{
    const {y,m} = state.viewMonth;
    setMonthlyFunds(y, m, parseFloat(ev.target.value) || 0);
    await saveMonthlyFunds();
    showToast('Available funds updated for ' + monthLabel(y,m));
    render();
  };

  document.getElementById('setPrevMonth').onclick = ()=>{ shiftMonth(-1); };
  document.getElementById('setNextMonth').onclick = ()=>{ shiftMonth(1); };

  const pinBtn = document.getElementById('pinThisMonth');
  if(pinBtn) pinBtn.onclick = async ()=>{
    state.pinnedMonth = {y: state.viewMonth.y, m: state.viewMonth.m};
    await savePinnedMonth();
    showToast('App will now open on ' + monthLabel(state.pinnedMonth.y, state.pinnedMonth.m));
    render();
  };
  const clearPinBtn = document.getElementById('clearPinnedMonth');
  if(clearPinBtn) clearPinBtn.onclick = async ()=>{
    state.pinnedMonth = null;
    await savePinnedMonth();
    showToast("App will now open on today's month");
    render();
  };

  document.querySelectorAll('[data-budget]').forEach(inp=>{
    inp.onchange = async ()=>{
      const {y,m} = state.viewMonth;
      setBudget(inp.dataset.budget, y, m, parseFloat(inp.value) || 0);
      await saveBudgets();
      showToast('Budget updated for ' + monthLabel(y,m));
    };
  });

  document.querySelectorAll('[data-delcat]').forEach(btn=>{
    btn.onclick = ()=>{ state.confirmDeleteCat = btn.dataset.delcat; render(); };
  });
  document.querySelectorAll('[data-catyes]').forEach(btn=>{
    btn.onclick = async ()=>{
      state.categories = state.categories.filter(c=>c.id!==btn.dataset.catyes);
      state.confirmDeleteCat = null;
      await saveCategories();
      render();
    };
  });
  document.querySelectorAll('[data-catno]').forEach(btn=>{
    btn.onclick = ()=>{ state.confirmDeleteCat = null; render(); };
  });

  document.querySelectorAll('[data-expand]').forEach(btn=>{
    btn.onclick = ()=>{
      state.expandedCategoryId = (state.expandedCategoryId === btn.dataset.expand) ? null : btn.dataset.expand;
      render();
    };
  });
  document.querySelectorAll('[data-delsub]').forEach(btn=>{
    btn.onclick = ()=>{ state.confirmDeleteSub = btn.dataset.delsub; render(); };
  });
  document.querySelectorAll('[data-subyes]').forEach(btn=>{
    btn.onclick = async ()=>{
      state.subcategories = state.subcategories.filter(s=>s.id!==btn.dataset.subyes);
      state.confirmDeleteSub = null;
      await saveSubcategories();
      render();
    };
  });
  document.querySelectorAll('[data-subno]').forEach(btn=>{
    btn.onclick = ()=>{ state.confirmDeleteSub = null; render(); };
  });
  document.querySelectorAll('[data-addsub]').forEach(btn=>{
    btn.onclick = async ()=>{
      const inp = document.querySelector(`[data-newsub="${btn.dataset.addsub}"]`);
      const name = inp.value.trim();
      if(!name){ showToast('Give it a name'); return; }
      state.subcategories.push({id: uid(), name, categoryId: btn.dataset.addsub});
      await saveSubcategories();
      render();
    };
  });

  document.getElementById('addCat').onclick = async ()=>{
    const nameInp = document.getElementById('newCatName');
    const budgetInp = document.getElementById('newCatBudget');
    const name = nameInp.value.trim();
    if(!name){ showToast('Give the category a name'); return; }
    const newCat = {id: uid(), name};
    state.categories.push(newCat);
    const initialBudget = parseFloat(budgetInp.value) || 0;
    if(initialBudget > 0){
      const {y,m} = state.viewMonth;
      setBudget(newCat.id, y, m, initialBudget);
      await saveBudgets();
    }
    await saveCategories();
    render();
  };

  const clearBtn = document.getElementById('clearAll');
  if(clearBtn) clearBtn.onclick = ()=>{ state.confirmClearAll = true; render(); };
  const clearYes = document.getElementById('clearYes');
  if(clearYes) clearYes.onclick = async ()=>{
    state.categories = DEFAULT_CATEGORIES.slice();
    state.subcategories = DEFAULT_SUBCATEGORIES.slice();
    state.entries = [];
    state.budgets = [];
    state.monthlyFunds = [];
    state.pinnedMonth = null;
    state.confirmClearAll = false;
    await saveCategories();
    await saveSubcategories();
    await saveEntries();
    await saveBudgets();
    await saveMonthlyFunds();
    await savePinnedMonth();
    showToast('All data cleared');
    render();
  };
  const clearNo = document.getElementById('clearNo');
  if(clearNo) clearNo.onclick = ()=>{ state.confirmClearAll = false; render(); };
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

loadData();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
